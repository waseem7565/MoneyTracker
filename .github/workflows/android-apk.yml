name: Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 / Android Gradle Plugin 8.13 need JDK 21. The Android SDK is preinstalled on GitHub's Ubuntu runners.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync it into the Android project
        run: npm run sync

      # Sign with the same debug key as the PC builds, so this APK installs over the app already on the phone.
      # Without it, Android refuses the update, and uninstalling to get around that deletes all the app's data.
      # The key comes from the DEBUG_KEYSTORE_BASE64 repository secret (base64 of ~/.android/debug.keystore).
      - name: Use the shared debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 isn't set. This APK can't update the app on your phone; do NOT uninstall the app to install it (that deletes your data)."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APKs (Expense Tracker and Add Transaction)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/quickadd/build/outputs/apk/debug/quickadd-debug.apk
          if-no-files-found: error
