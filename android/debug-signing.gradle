// Debug signing for both apps (Expense Tracker and Add Transaction).
// On GitHub Actions, DEBUG_KEYSTORE_FILE points at the PC's debug keystore (decoded from the DEBUG_KEYSTORE_BASE64
// secret), so the APK it builds installs as an update over the app on the phone. Without it (builds on the PC),
// Android's default debug keystore is used, which is that same key.
android {
    signingConfigs {
        debug {
            def ks = System.getenv('DEBUG_KEYSTORE_FILE')
            if (ks) {
                if (!file(ks).exists()) throw new GradleException("DEBUG_KEYSTORE_FILE doesn't exist: $ks")
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}
